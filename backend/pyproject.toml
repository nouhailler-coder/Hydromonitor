[project]
name = "hydromonitor-backend"
version = "1.0.0"
description = "HydroMonitor FastAPI + PostGIS Hydrological Platform Backend"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["../tests"]
pythonpath = [".", ".."]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
