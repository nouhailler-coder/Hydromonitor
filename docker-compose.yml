version: "3.9"

services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: hydromonitor-postgis
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hydromonitor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hydromonitor_dev}
      POSTGRES_DB: ${POSTGRES_DB:-hydromonitor}
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
      - ./database/seeds:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hydromonitor -d hydromonitor"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.backend
    container_name: hydromonitor-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://hydromonitor:hydromonitor_dev@postgres:5432/hydromonitor
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-gen-lang-client-0257614236}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-gen-lang-client-0257614236}
      HUBEAU_BASE_URL: https://hubeau.eaufrance.fr/api/v1/temperature
      GLOFAS_EWDS_URL: https://ewds.climate.copernicus.eu/api
      GLOFAS_VERSION: "5.0"
      CORS_ORIGINS: "http://localhost:3000,http://localhost:5173"
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: hydromonitor-pgadmin
    profiles: ["tools"]
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@hydromonitor.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  postgis_data:
